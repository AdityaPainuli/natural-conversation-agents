[project]
name = "natural-conversation-agents"
version = "0.1.0"
description = "Reference implementation for the talk: How to Make Agents Talk Like Humans"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
demo = ["rich>=13.0", "matplotlib>=3.8"]
live = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
